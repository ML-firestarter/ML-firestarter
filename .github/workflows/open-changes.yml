# Opens a pull request for the change people voted for, and keeps it on the one with the most
# votes. The triage (triage-comments.yml) proposes changes on the issues of readers' comments, and
# people vote for them by reacting with 👍. A proposal gets the votes with 3 of them, unless the
# CHANGE_VOTES repository variable says otherwise, or with one from a maintainer, and the first to
# get them becomes a pull request from the comment-<issue number> branch, credited to the reader.
# The votes go on while it's open: when another proposal with the votes has more of them, its
# change replaces the one on the branch and in the description. A maintainer can instead comment
# /accept and a proposal's number, or just /accept for the newest one, to put it on the pull
# request right away; from then on the votes no longer change it, and another /accept does. A
# commit someone else puts on the branch stops both, and once the pull request is closed, only the
# proposals and the /accepts written after it count. The description's hidden marker holds what
# the site needs to show the change on the note's pages until it's merged (changeFrom in
# src/lib/comments.ts). GitHub has no event for reactions, so the votes are counted every 15
# minutes; run the workflow by hand to count them right away.
name: Open voted changes

on:
  # Off the quarter hours, when GitHub is busiest and delays or drops scheduled runs.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  open:
    # The vote count, or a maintainer's /accept on an issue sent from the site.
    if: >-
      github.event_name != 'issue_comment' || (contains(github.event.issue.body, '<!-- ml-firestarter:comment ') &&
      !github.event.issue.pull_request && github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/accept') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time. It's on the job rather than the workflow, so that the runs other comments
    # start, whose job is skipped, don't take the place of one that's waiting.
    concurrency:
      group: open-changes
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Put the accepted or most voted proposals on pull requests
        uses: actions/github-script@v9
        env:
          VOTES: ${{ vars.CHANGE_VOTES }}
        with:
          script: |
            const changes = require('./.github/scripts/changes.cjs');
            const { owner, repo } = context.repo;
            const needed = changes.votesNeeded(process.env.VOTES);
            // A maintainer's /accept, when a comment started the run rather than the schedule:
            // `/accept`, then a proposal's number or nothing. The job's condition lets `/accepted`
            // through too.
            const request = context.eventName === 'issue_comment' ? context.payload.comment : undefined;
            const ACCEPT = /^\/accept\b(.*)/i;
            if (request && !ACCEPT.test(request.body)) return;
            // A scheduled run's event doesn't say which branch is the default one.
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const base = repository.default_branch;

            const maintainers = new Map();
            async function isMaintainer(login) {
              if (!maintainers.has(login)) maintainers.set(login, await changes.isMaintainer(github, context.repo, login));
              return maintainers.get(login);
            }
            async function removeLabel(issue_number) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'proposal' });
              } catch (error) {
                // 404: it's gone already.
                if (error.status !== 404) throw error;
              }
            }

            // The change on a comment's branch: whether this workflow made it, and which proposal it
            // is, from its commit's trailer. Undefined when there's no branch.
            async function changeOn(branch) {
              try {
                const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
                if (data.commit.author?.login !== changes.WORKFLOWS) return { ours: false };
                const number = /^Proposal: (\d+)$/m.exec(data.commit.commit.message)?.[1];
                return { ours: true, proposal: number === undefined ? undefined : Number(number) };
              } catch (error) {
                if (error.status === 404) return undefined;
                throw error;
              }
            }

            // What a comment accepts: nothing when it isn't an /accept, or is a bot's or a deleted
            // account's, else the proposal it names or what's wrong with it. That's one of the
            // proposals written before it, and after the comment's pull request was last closed, if
            // it was.
            async function acceptIn(comment, proposals, closedPull) {
              const accept = ACCEPT.exec(comment.body ?? '');
              if (!accept || !comment.user || comment.user.type === 'Bot') return undefined;
              if (!(await isMaintainer(comment.user.login))) return { problem: 'Only maintainers can accept a proposal. Vote for it with 👍 instead.' };
              const number = /^\s*#?(\d+)\b/.exec(accept[1])?.[1];
              if (number === undefined && accept[1].trim() !== '') return { problem: 'Which proposal? Comment `/accept` and its number, like `/accept 2`.' };
              const before = proposals.filter((proposal) => proposal.comment.created_at <= comment.created_at);
              const proposal = number === undefined ? before.at(-1) : before.find(({ data }) => data.number === Number(number));
              if (!proposal) return { problem: number === undefined ? "There's no proposal on this issue to accept yet." : `There's no proposal ${Number(number)} on this issue.` };
              const { number: n, status } = proposal.data;
              if (status === 'stale') return { problem: `Proposal ${n} no longer fits the note, which changed since Copilot wrote it. Comment \`/propose\` to have Copilot write it again.` };
              if (closedPull && proposal.comment.created_at <= closedPull.closed_at) {
                return { problem: `Proposal ${n} is from before pull request #${closedPull.number} was closed, so it can't be accepted anymore. Comment \`/propose\` for a new one.` };
              }
              return { proposal };
            }

            // Has the pull request of an issue's comment follow a maintainer's /accept, or else the
            // votes on the issue's proposals.
            async function follow(issue) {
              const issue_number = issue.number;
              const branch = `comment-${issue_number}`;
              const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number, body });
              // The comment's pull requests: an open one has the change that's accepted or voted
              // for, and a closed one ends the vote on the proposals written before it was closed.
              const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, head: `${owner}:${branch}`, state: 'all', per_page: 100 });
              const open = pulls.find((pull) => pull.state === 'open');
              const closedPull = pulls.filter((pull) => pull.closed_at).sort((a, b) => a.closed_at.localeCompare(b.closed_at)).at(-1);
              const since = (comment) => !(closedPull && comment.created_at <= closedPull.closed_at);
              // Commits someone else put on the branch are theirs to keep, unless the pull request
              // they were for was closed since.
              const theirs = (now) => (open && !now?.ours) || (now?.ours === false && pulls.length === 0);
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              // The /accept this run is for, should the list not have it yet.
              if (request && !comments.some((comment) => comment.id === request.id)) comments.push(request);
              const all = changes.proposalsIn(comments);

              // The last /accept of a maintainer decides. What's wrong with one is told only when
              // it's new; the counts after pass over it.
              let accepted;
              for (const comment of comments) {
                const accept = await acceptIn(comment, all, closedPull);
                if (accept?.problem && comment.id === request?.id) return reply(accept.problem);
                if (accept?.proposal) accepted = { ...accept.proposal, by: comment.user.login };
              }
              if (accepted) {
                const now = await changeOn(branch);
                if (theirs(now)) {
                  core.info(`The ${branch} branch has commits that aren't this workflow's, so the /accept on #${issue_number} doesn't change it.`);
                  if (request) await reply(`The \`${branch}\` branch has commits that aren't this workflow's, so accepting a proposal doesn't change it.`);
                  return;
                }
                const current = now?.proposal;
                // A new /accept tries again to open the pull request of a change on the branch
                // that has none; the counts don't, so as not to post the link for opening it again.
                if (current === accepted.data.number && (open || !request)) {
                  if (request) await reply(`Pull request #${open.number} has proposal ${current} already, and the votes no longer change it.`);
                  return;
                }
                await putOnBranch(issue, accepted, { open, current });
                return;
              }
              // Only the counts follow the votes; a comment's run gets here when the comment was
              // edited since into something other than an /accept.
              if (request) return;

              const proposals = all.filter(({ comment, data }) => data.status !== 'stale' && since(comment));
              if (proposals.length === 0) return removeLabel(issue_number);

              // Everyone's vote counts, and a proposal gets the votes with its `needed`th, or with its
              // first from a maintainer.
              const counted = [];
              for (const proposal of proposals) {
                let votes = [];
                // A comment counts its reactions, so one without a 👍 needs no looking into.
                if (proposal.comment.reactions?.['+1'] !== 0) {
                  const reactions = await github.paginate(github.rest.reactions.listForIssueComment, { owner, repo, comment_id: proposal.comment.id, content: '+1', per_page: 100 });
                  votes = reactions.filter((reaction) => reaction.user && reaction.user.type !== 'Bot').sort((a, b) => a.created_at.localeCompare(b.created_at));
                }
                let at;
                for (const [i, vote] of votes.entries()) {
                  if (i + 1 >= needed || (await isMaintainer(vote.user.login))) {
                    at = vote.created_at;
                    break;
                  }
                }
                counted.push({ ...proposal, at, voters: votes.map((vote) => vote.user.login) });
              }
              if (!counted.some((proposal) => proposal.at)) return;

              const now = await changeOn(branch);
              if (theirs(now)) {
                core.info(`The ${branch} branch has commits that aren't this workflow's, so the votes on #${issue_number} don't change it.`);
                return;
              }
              // Of the proposals with the votes, and the one on the branch, the most votes win. On a
              // tie, the branch keeps its change, or else the first to get the votes wins; one that
              // no longer fits the note makes way for the next.
              const current = now?.proposal;
              const ranked = counted
                .filter((proposal) => proposal.at || proposal.data.number === current)
                .sort((a, b) => b.voters.length - a.voters.length || (b.data.number === current) - (a.data.number === current) || (a.at ?? '').localeCompare(b.at ?? ''));
              for (const proposal of ranked) {
                if (proposal.data.number === current || (await putOnBranch(issue, proposal, { open, current }))) return;
              }
            }

            // Puts a proposal's change on the comment's branch, as one commit on the default branch
            // that credits the reader, and opens its pull request, or has the open one show it
            // instead of the change it had. `by` is the maintainer who accepted it, when the votes
            // didn't decide. False when the proposal no longer fits the note.
            async function putOnBranch(issue, { comment, data: proposal, voters, by }, { open, current }) {
              const issue_number = issue.number;
              const branch = `comment-${issue_number}`;
              const { data: head } = await github.rest.repos.getBranch({ owner, repo, branch: base });
              const applied = await changes.applyEdits(github, context.repo, head.commit.sha, proposal.edits);
              if (applied.problem) {
                const got = by ? 'was accepted' : 'got the votes';
                const note = "This proposal no longer fits the note, which changed since Copilot wrote it, so it can't become a pull request.";
                await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body: changes.settledBody(comment.body, proposal, 'stale', note) });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Proposal ${proposal.number} ${got}, but it no longer fits the note, which changed since Copilot wrote it: ${applied.problem}. The reader or a maintainer can comment \`/propose\` to have Copilot write it again.`,
                });
                core.notice(`Proposal ${proposal.number} on #${issue_number} ${got} but no longer fits the note: ${applied.problem}.`);
                return false;
              }

              const reader = issue.user;
              const title = `Apply comment #${issue_number} on ${proposal.name}`;
              const { data: tree } = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: head.commit.commit.tree.sha,
                tree: applied.files.map((file) => ({ path: file.path, mode: '100644', type: 'blob', content: file.after })),
              });
              const { data: commit } = await github.rest.git.createCommit({
                owner,
                repo,
                tree: tree.sha,
                parents: [head.commit.sha],
                message: [
                  title,
                  `Copilot's proposal ${proposal.number} for the reader's comment, ${by ? `accepted by ${by}` : 'voted in'} on #${issue_number}, in every language version of the note. Closes #${issue_number}.`,
                  // The proposal's number tells the next count which change the branch has.
                  [`Proposal: ${proposal.number}`, reader && `Co-authored-by: ${reader.login} <${reader.id}+${reader.login}@users.noreply.github.com>`].filter(Boolean).join('\n'),
                ].join('\n\n'),
              });

              const text = [
                `The change asked for in #${issue_number}: Copilot's proposal ${proposal.number}, ${by ? `accepted by ${changes.plain(by)}` : `voted in by ${voters.map((login) => changes.plain(login)).join(', ')}`}.`,
                changes.versionList(proposal, applied.files),
                proposal.remarks && `**Copilot's remarks:** ${changes.plain(proposal.remarks)}`,
                by
                  ? `A maintainer accepted this proposal on #${issue_number}, so the votes there no longer change this pull request; another \`/accept\` there does, and a commit of your own on the \`${branch}\` branch stops that.`
                  : `While this pull request is open, the votes on #${issue_number} go on: when another proposal with the votes has more of them, its change replaces this one. Commenting \`/accept\` and a proposal's number there settles it, and a commit of your own on the \`${branch}\` branch stops it.`,
                `Until this pull request is merged or closed, signed-in readers see its change on the note's pages, with the reader's comment. Copilot wrote the change from a reader's comment, so check the wording and the translation before merging. Merging closes #${issue_number}.`,
              ].filter(Boolean).join('\n\n');
              // What the site shows.
              const data = {
                v: 1,
                issue: issue_number,
                reader: { login: reader?.login ?? 'ghost', avatar: reader?.avatar_url ?? '' },
                created: issue.created_at,
                file: proposal.file,
                path: proposal.path,
                lang: proposal.lang,
                comment: proposal.comment,
                changes: applied.files.flatMap((file) => file.hunks.map((hunk) => ({ file: file.path, before: hunk.before.join('\n'), after: hunk.after.join('\n') }))),
              };
              const marked = `${text}\n\n${changes.marker(changes.CHANGE, data)}`;
              const body = marked.length <= changes.MAX_BODY ? marked : text;

              if (open) {
                // The description first: should the branch not follow, the next count tries again.
                await github.rest.pulls.update({ owner, repo, pull_number: open.number, body });
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha, force: true });
                const instead = `pull request #${open.number} has its change instead of ${current === undefined ? 'the one it had' : `proposal ${current}'s`}`;
                const votes = voters && (voters.length === 1 ? 'a vote' : `${voters.length} votes`);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: by
                    ? `Proposal ${proposal.number} is accepted, so ${instead}. The votes no longer change it; another \`/accept\` does.`
                    : `Proposal ${proposal.number} leads the vote now, with ${votes}, so ${instead}.`,
                });
                core.notice(`Pull request #${open.number} has proposal ${proposal.number} of #${issue_number} now.`);
                return true;
              }

              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.sha });
              } catch (error) {
                // 422: the branch is there already, from a pull request that was closed or from a
                // link for opening one.
                if (error.status !== 422) throw error;
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha, force: true });
              }
              try {
                const { data: pull } = await github.rest.pulls.create({ owner, repo, title, head: branch, base, body });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: by
                    ? `Proposal ${proposal.number} is accepted, so it's a pull request now: #${pull.number}, for the maintainer to check and merge. Until then, signed-in readers see the change on the note's pages. The votes no longer change it; another \`/accept\` does.`
                    : `Proposal ${proposal.number} got the votes, so it's a pull request now: #${pull.number}, for the maintainer to check and merge. Until then, signed-in readers see the change on the note's pages. The votes go on meanwhile: if another proposal gets more of them, the pull request gets its change instead.`,
                });
                core.notice(`Opened ${pull.html_url} for #${issue_number}.`);
                return true;
              } catch (error) {
                // "GitHub Actions is not permitted to create or approve pull requests", until the repository allows it.
                if (error.status !== 403) throw error;
              }

              // Until then, the issue gets a link that opens the pull request filled in, with the
              // site's marker when the link can hold it.
              const compare = (description) => `${context.serverUrl}/${owner}/${repo}/compare/${base}...${branch}?${new URLSearchParams({ expand: '1', title, body: description })}`;
              const link = compare(body).length <= 8000 ? compare(body) : compare(text);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Proposal ${proposal.number} ${by ? 'is accepted' : 'got the votes'}, and its change is on the \`${branch}\` branch. [Open a pull request](${link}) to check it and merge it.`,
              });
              core.warning(`GitHub Actions can't open pull requests in this repository, so the change for #${issue_number} is on the ${branch} branch and the issue has a link for opening one. To have them opened for you, turn on "Allow GitHub Actions to create and approve pull requests" under Settings → Actions → General.`);
              return true;
            }

            // A maintainer's /accept counts right away, for its issue only.
            if (request) return follow(context.payload.issue);
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'proposal', per_page: 100 });
            for (const issue of issues) {
              // Pull requests are issues too, for GitHub.
              if (issue.pull_request) continue;
              try {
                await follow(issue);
              } catch (error) {
                // The other issues' votes still count.
                core.warning(`Couldn't follow the votes on #${issue.number}: ${error.message}`);
              }
            }
