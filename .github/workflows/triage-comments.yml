# Readers' comments on passages of the notes arrive as issues, which the site opens as the reader
# (src/lib/comments.ts). Each issue is assigned to its reader, so GitHub keeps them posted on it.
# Copilot reads each new comment next to the note it's about: it closes spam, tests and comments
# that aren't about the notes, and the rest get the needs-review label for the maintainer. When it
# keeps a comment that suggests new wording or points out a mistake, Copilot also writes the change
# into every language version of the note, and the workflow proposes it on the issue for a vote;
# open-changes.yml opens a pull request with the first proposal to get the votes, and keeps it on
# the one with the most. The reader or a maintainer can comment /propose and what to change, even
# while the pull request is open, and Copilot writes another proposal that follows the discussion
# and the votes. Without the COPILOT_GITHUB_TOKEN secret, or when Copilot's answer is unclear, a
# comment is kept for review and nothing is proposed.
name: Triage comments

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    # Only issues sent from the site, which end with its marker: when they're opened, and when
    # someone asks for a proposal on one that's open.
    if: >-
      contains(github.event.issue.body, '<!-- ml-workout:comment ') && (github.event_name == 'issues' ||
      (!github.event.issue.pull_request && github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/propose') && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time for each issue, so its proposals are numbered in order.
    concurrency:
      group: triage-comment-${{ github.event.issue.number }}
    permissions:
      contents: read
      issues: write
    env:
      HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
      VOTES: ${{ vars.CHANGE_VOTES }}
    steps:
      - name: Check out the prompts and scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/prompts
            .github/scripts
          persist-credentials: false

      # The issue and the comments are read from the event and the API, never pasted into scripts,
      # so their text can't run as code.
      - name: Read the comment
        id: read
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const changes = require('./.github/scripts/changes.cjs');
            const { issue, comment: request, repository } = context.payload;
            const { owner, repo } = context.repo;
            const issue_number = issue.number;
            const reader = issue.user.login;
            // Someone asked for a proposal with /propose, rather than the reader opening the issue.
            const asked = context.eventName === 'issue_comment';
            const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number, body });

            const labels = [
              { name: 'text-comment', color: 'c5def5', description: 'Comment on a passage of the notes, sent from the site' },
              { name: 'needs-review', color: 'fbca04', description: 'Comment kept by the triage for the maintainer' },
              { name: 'off-topic', color: 'd4c5f9', description: 'Comment closed by the triage: not feedback on the notes' },
              { name: 'proposal', color: '0e8a16', description: 'A change from the comment is up for a vote' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                // 422: the label is there already.
                if (error.status !== 422) throw error;
              }
            }
            if (!asked) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['text-comment'] });
              // The comment is its reader's: as the assignee, they hear about replies, proposals and
              // the pull request that settles it.
              const { data: assigned } = await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [reader] });
              if (!assigned.assignees?.some((user) => user.login === reader)) core.warning(`GitHub didn't assign the issue to ${reader}.`);
            }

            const data = changes.commentFrom(issue.body);
            if (!data) {
              if (asked) {
                core.warning("The issue's marker isn't one the site writes, so nothing is proposed.");
              } else {
                core.warning("The issue's marker isn't one the site writes: keeping it for review.");
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-review'] });
              }
              return;
            }

            // Copilot's CLI gets the prompt as an argument, which Linux caps at 128 KiB.
            const { clip } = changes;
            // Nothing in them can end the tags the prompts put around them.
            const inert = (text) => text.replace(/<(\/?)(note|passage|comment|suggestion|discussion|entry|proposals|proposal|request|edit|find|replace|remarks)\b/gi, '‹$1$2');

            let discussion = 'Nothing yet: this is the first proposal.';
            let proposals = 0;
            if (asked) {
              // `/propose`, then what to change; the job's condition lets `/proposed` through too.
              const asking = /^\/propose\b([\s\S]*)$/i.exec(request.body);
              if (!asking) return;
              const asker = request.user.login;
              const maintainer = await changes.isMaintainer(github, context.repo, asker);
              if (asker !== reader && !maintainer) {
                await reply('Only the reader who wrote this comment and the maintainers can ask Copilot for a proposal. Say here what you would change, and they can ask for it.');
                return;
              }
              if (process.env.HAS_COPILOT_TOKEN !== 'true') {
                core.notice('There is no COPILOT_GITHUB_TOKEN secret, so Copilot writes no proposals.');
                await reply("Copilot can't write proposals in this repository yet.");
                return;
              }
              // A pull request for the comment doesn't stop the vote: a new proposal joins it.
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const earlier = changes.proposalsIn(comments);
              if (!maintainer && earlier.length >= changes.MAX_PROPOSALS) {
                await reply(`Copilot has written ${earlier.length} proposals for this comment, as many as a reader can ask for. A maintainer can still ask for another.`);
                return;
              }
              // Numbered on from the last, so no two share a number even when one was deleted.
              proposals = Math.max(0, ...earlier.map(({ data }) => data.number));

              // What people said, as much of it as fits, keeping the newest; the workflows' own
              // comments show in the proposals.
              const MAINTAINERS = ['OWNER', 'MEMBER', 'COLLABORATOR'];
              const roleOf = (login, isMaintainer) => [login === reader && 'the reader', isMaintainer && 'maintainer'].filter(Boolean).join(' and ') || 'someone else';
              const entries = [];
              let bytes = 0;
              for (const said of comments.filter((comment) => comment.id !== request.id && comment.user?.type !== 'Bot').slice(-30).reverse()) {
                const login = said.user?.login ?? 'ghost';
                const entry = `<entry author="${login}" role="${roleOf(login, MAINTAINERS.includes(said.author_association))}">\n${clip(inert(said.body ?? ''), 1500)}\n</entry>`;
                bytes += Buffer.byteLength(entry);
                if (bytes > 10_000) break;
                entries.unshift(entry);
              }
              // The proposals so far and their votes, as many as fit, the most voted and then the
              // newest first; Copilot gets them by number.
              const votesFor = ({ comment }) => comment.reactions?.['+1'] ?? 0;
              const shown = [];
              let room = 10_000;
              for (const proposal of [...earlier].sort((a, b) => votesFor(b) - votesFor(a) || b.data.number - a.data.number)) {
                if (room < 1000) break;
                const edits = proposal.data.edits.map((edit) => `<edit lang="${edit.lang}">\n<find>\n${inert(edit.find)}\n</find>\n<replace>\n${inert(edit.replace)}\n</replace>\n</edit>`);
                const entry = `<proposal number="${proposal.data.number}" votes="${votesFor(proposal)}">\n${clip(edits.join('\n'), room - 100)}\n</proposal>`;
                room -= Buffer.byteLength(entry);
                shown.push({ number: proposal.data.number, entry });
              }
              shown.sort((a, b) => a.number - b.number);
              discussion = [
                `<discussion>\n${entries.join('\n') || '(Nothing said yet.)'}\n</discussion>`,
                shown.length > 0 && `<proposals>\n${shown.map(({ entry }) => entry).join('\n')}\n</proposals>`,
                `<request author="${asker}" role="${roleOf(asker, maintainer)}">\n${clip(inert(asking[1].trim()), 3000) || '(Nothing more.)'}\n</request>`,
              ].filter(Boolean).join('\n\n');
            }

            // Every language version of the note, the one the reader read first.
            const { name, read, paths } = changes.versionsOf(data.file);
            const versions = {};
            for (const [lang, version] of Object.entries(paths)) {
              try {
                const { data: content } = await github.rest.repos.getContent({ owner, repo, path: version, ref: repository.default_branch });
                if (!Array.isArray(content) && content.type === 'file') versions[lang] = { path: version, text: Buffer.from(content.content, 'base64').toString('utf8') };
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const comment = [
              `<passage>\n${inert(data.exact)}\n</passage>`,
              `<comment>\n${inert(data.comment) || '(none)'}\n</comment>`,
              data.suggestion !== undefined && `<suggestion>\n${inert(data.suggestion)}\n</suggestion>`,
            ].filter(Boolean).join('\n\n');
            if (!asked) {
              const triage = path.join(process.env.RUNNER_TEMP, 'triage');
              await fs.mkdir(triage, { recursive: true });
              await fs.writeFile(path.join(triage, 'note.md'), clip(inert(versions[read]?.text ?? '(This note is no longer in the repository.)'), 48_000));
              await fs.writeFile(path.join(triage, 'comment.md'), clip(comment, 12_000));
            }

            // For the change, if Copilot keeps a comment that asks for one or someone asked for it.
            if (versions[read]) {
              const sync = path.join(process.env.RUNNER_TEMP, 'sync');
              await fs.mkdir(sync, { recursive: true });
              const notes = Object.entries(versions).map(([lang, version]) => `<note lang="${lang}" file="${version.path}">\n${clip(inert(version.text), 36_000)}\n</note>`);
              await fs.writeFile(path.join(sync, 'versions.md'), notes.join('\n\n'));
              await fs.writeFile(path.join(sync, 'comment.md'), clip(`The reader commented on the ${read} version, ${data.file}.\n\n${comment}`, 12_000));
              await fs.writeFile(path.join(sync, 'discussion.md'), discussion);
              // What the proposal keeps for its pull request, and for the site to show.
              const note = {
                name,
                read,
                versions: Object.fromEntries(Object.entries(versions).map(([lang, version]) => [lang, version.path])),
                file: data.file,
                path: data.path,
                lang: data.lang,
                comment: data.comment.slice(0, 3000),
                proposals,
              };
              await fs.writeFile(path.join(sync, 'note.json'), JSON.stringify(note));
              core.setOutput('note-found', 'true');
            } else if (asked) {
              await reply("The note this comment is on is no longer in the repository, so there's nothing to propose.");
              return;
            }

            if (asked) {
              // Seen: a proposal is on its way.
              await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: request.id, content: 'eyes' });
              core.setOutput('propose', 'true');
              return;
            }
            if (data.suggestion !== undefined) core.setOutput('suggestion', 'true');
            core.setOutput('lang', data.lang);
            core.setOutput('ready', 'true');

      - name: Set up Node
        if: (steps.read.outputs.ready == 'true' || steps.read.outputs.propose == 'true') && env.HAS_COPILOT_TOKEN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Copilot CLI
        if: (steps.read.outputs.ready == 'true' || steps.read.outputs.propose == 'true') && env.HAS_COPILOT_TOKEN == 'true'
        run: |
          npm install --global @github/copilot
          # The comment and its discussion are strangers' text, so Copilot gets no tools: whatever they
          # say, Copilot can only answer, not run commands, read files or open pages. ai-inference leaves
          # the CLI's errors out of the log, so they're kept for the step that reads the answer.
          cat > "$RUNNER_TEMP/copilot-no-tools" <<'EOF'
          #!/usr/bin/env bash
          copilot \
            --excluded-tools=bash,list_bash,read_bash,stop_bash,write_bash,apply_patch,create,edit,view,glob,grep,rg,web_fetch,task,list_agents,read_agent,write_agent,skill \
            --deny-tool=shell,read,write,url,memory \
            --disable-builtin-mcps --no-custom-instructions --no-auto-update --disallow-temp-dir "$@" \
            2> "$RUNNER_TEMP/copilot-errors.log"
          status=$?
          cat "$RUNNER_TEMP/copilot-errors.log" >&2
          exit "$status"
          EOF
          chmod +x "$RUNNER_TEMP/copilot-no-tools"

      - name: Ask Copilot
        id: copilot
        if: steps.read.outputs.ready == 'true' && env.HAS_COPILOT_TOKEN == 'true'
        # Without an answer, the comment is kept for review.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/ai-inference@v3
        with:
          prompt-file: .github/prompts/triage-comment.prompt.yml
          file_input: |
            note: ${{ runner.temp }}/triage/note.md
            comment: ${{ runner.temp }}/triage/comment.md
          # auto: a model the Copilot plan has. The COPILOT_MODEL repository variable can name one.
          model: ${{ vars.COPILOT_MODEL || 'auto' }}
          copilot-cli-path: ${{ runner.temp }}/copilot-no-tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Close or keep the comment
        id: decide
        if: steps.read.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          COPILOT_OUTCOME: ${{ steps.copilot.outcome }}
          RESPONSE_FILE: ${{ steps.copilot.outputs.response-file }}
          COMMENT_LANG: ${{ steps.read.outputs.lang }}
          HAS_SUGGESTION: ${{ steps.read.outputs.suggestion }}
          NOTE_FOUND: ${{ steps.read.outputs.note-found }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // The CLI's error, which ai-inference leaves out of the log. Copilot is only sent what's
            // public already, and GitHub masks the token, so it can be shown here.
            const copilotError = async () => {
              const log = await fs.readFile(path.join(process.env.RUNNER_TEMP, 'copilot-errors.log'), 'utf8').catch(() => '');
              const text = log.replace(/\x1b\[[\d;]*[a-z]/gi, '').replace(/\s+/g, ' ').trim();
              return text.length <= 1000 ? text : `${text.slice(0, 999)}…`;
            };

            let verdict;
            if (process.env.HAS_COPILOT_TOKEN !== 'true') {
              core.notice('There is no COPILOT_GITHUB_TOKEN secret, so comments are kept for review.');
            } else if (process.env.COPILOT_OUTCOME === 'failure') {
              const error = await copilotError();
              core.warning(`Copilot didn't answer, so the comment is kept for review. ${error ? `The Copilot CLI said: ${error}` : 'The "Ask Copilot" step shows why.'}`);
            } else {
              const response = process.env.RESPONSE_FILE ? await fs.readFile(process.env.RESPONSE_FILE, 'utf8').catch(() => '') : '';
              try {
                verdict = JSON.parse(response.slice(response.indexOf('{'), response.lastIndexOf('}') + 1));
                const { decision, category, confidence, reason } = verdict;
                // On one line, so nothing in Copilot's answer can pass for a command to the runner.
                core.info(`Copilot: ${decision}, ${category}, confidence ${confidence}: ${String(reason).slice(0, 300)}`.replace(/\s+/g, ' '));
              } catch {
                core.warning("Copilot didn't give the answer asked for, so the comment is kept for review.");
              }
            }

            // Only clear cases are closed: the rest are for the maintainer.
            const CLOSE = ['spam', 'off-topic', 'test', 'noise', 'abuse'];
            const { decision, category, confidence } = verdict ?? {};
            if (decision !== 'close' || !CLOSE.includes(category) || typeof confidence !== 'number' || confidence < 0.8) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-review'] });
              // A comment Copilot keeps can ask for a change: new wording, or a mistake to fix.
              const asksForChange = process.env.HAS_SUGGESTION === 'true' || category === 'correction';
              if (decision === 'keep' && asksForChange && process.env.NOTE_FOUND === 'true') core.setOutput('change', 'true');
              return;
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['off-topic'] });
            // Spam and abuse are closed without a word.
            if (category !== 'spam' && category !== 'abuse') {
              const body =
                process.env.COMMENT_LANG === 'pl'
                  ? 'Zamknięte automatycznie: to nie wygląda na uwagę do notatek. Jeśli to pomyłka, odpowiedz tutaj, a opiekun notatek się temu przyjrzy.'
                  : "Closed automatically: this doesn't look like feedback on the notes. If that's a mistake, reply here and the maintainer will take a look.";
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'not_planned' });

      - name: Ask Copilot for the change in every language
        id: sync
        if: steps.decide.outputs.change == 'true' || steps.read.outputs.propose == 'true'
        # Without an answer, nothing is proposed.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/ai-inference@v3
        with:
          prompt-file: .github/prompts/sync-change.prompt.yml
          file_input: |
            versions: ${{ runner.temp }}/sync/versions.md
            comment: ${{ runner.temp }}/sync/comment.md
            discussion: ${{ runner.temp }}/sync/discussion.md
          # auto: a model the Copilot plan has. The COPILOT_MODEL repository variable can name one.
          model: ${{ vars.COPILOT_MODEL || 'auto' }}
          copilot-cli-path: ${{ runner.temp }}/copilot-no-tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      # Copilot's change goes on the issue as a proposal, for people to vote on (open-changes.yml).
      - name: Propose the change
        if: steps.decide.outputs.change == 'true' || steps.read.outputs.propose == 'true'
        uses: actions/github-script@v9
        env:
          COPILOT_OUTCOME: ${{ steps.sync.outcome }}
          RESPONSE_FILE: ${{ steps.sync.outputs.response-file }}
          ASKED: ${{ steps.read.outputs.propose }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const changes = require('./.github/scripts/changes.cjs');
            const { owner, repo } = context.repo;
            const { issue, repository } = context.payload;
            const issue_number = issue.number;
            // Someone asked for this proposal with /propose, and waits for an answer.
            const asked = process.env.ASKED === 'true';
            const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number, body });
            const again = 'The reader or a maintainer can comment `/propose` and what to change to have Copilot try again.';

            // The CLI's error, as in "Close or keep the comment".
            const copilotError = async () => {
              const log = await fs.readFile(path.join(process.env.RUNNER_TEMP, 'copilot-errors.log'), 'utf8').catch(() => '');
              const text = log.replace(/\x1b\[[\d;]*[a-z]/gi, '').replace(/\s+/g, ' ').trim();
              return text.length <= 1000 ? text : `${text.slice(0, 999)}…`;
            };
            if (process.env.COPILOT_OUTCOME !== 'success') {
              const error = await copilotError();
              core.warning(`Copilot didn't answer, so nothing is proposed. ${error ? `The Copilot CLI said: ${error}` : 'The "Ask Copilot for the change in every language" step shows why.'}`);
              if (asked) await reply("Copilot couldn't write a proposal this time. Comment `/propose` again later to have it try again.");
              return;
            }

            const note = JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, 'sync', 'note.json'), 'utf8'));
            const response = process.env.RESPONSE_FILE ? await fs.readFile(process.env.RESPONSE_FILE, 'utf8').catch(() => '') : '';
            const { edits, remarks } = changes.parseAnswer(response);
            if (edits.length === 0) {
              if (!remarks) {
                core.warning("Copilot didn't answer with a change in the form asked for, so nothing is proposed.");
                if (asked) await reply(`Copilot didn't answer with a change this time. ${again}`);
                return;
              }
              // Copilot found nothing to change, and says why: that's for the reader to hear.
              core.notice(`Copilot proposes no change: ${remarks}`);
              await reply(`Copilot proposes no change for this comment. **Its remarks:** ${changes.plain(remarks)}\n\n${again}`);
              return;
            }
            core.info(`Copilot: ${remarks}`);

            async function refuse(problem) {
              core.warning(`Copilot's change can't be proposed, because ${problem}.`);
              await reply(`Copilot's change can't be proposed, because ${problem}. ${again}`);
            }
            const problem = changes.problemWith(edits, { ...note, remarks, first: !asked });
            if (problem) return refuse(problem);
            // On the notes as they are now, to show the change and to check that it fits.
            const planned = edits.map((edit) => ({ ...edit, path: note.versions[edit.lang] }));
            const applied = await changes.applyEdits(github, context.repo, repository.default_branch, planned);
            if (applied.problem) return refuse(applied.problem);

            const { name, read, versions, file, path: page, lang, comment } = note;
            const proposal = { v: 1, number: note.proposals + 1, name, read, versions, file, path: page, lang, comment, remarks, edits: planned };
            const body = changes.proposalBody(proposal, applied.files, changes.votesNeeded(process.env.VOTES));
            if (body.length > changes.MAX_BODY) return refuse('it is too long to show here');
            await reply(body);
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['proposal'] });
            core.notice(`Proposal ${proposal.number} is on #${issue_number}.`);
