<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <title>The network: the ride length x goes into two hidden neurons, h₁ with the weight −2 and the bias 6, and h₂ with the weight 2 and the bias −22, and both of them go into the output neuron, with the weights 4 and 4 and the bias −3, which gives the probability p</title>
  <g fill="#8a847d">
    <text x="110" y="34" text-anchor="middle">input</text>
    <text x="320" y="34" text-anchor="middle">hidden layer</text>
    <text x="530" y="34" text-anchor="middle">output layer</text>
    <text x="110" y="247" text-anchor="middle" font-size="14">ride (km)</text>
    <text x="530" y="247" text-anchor="middle" font-size="14">probability</text>
  </g>
  <g fill="none" stroke="#8a847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M135 184.9L293.1 120.9M282 120L293.1 120.9L285.7 129.3" />
    <path d="M135 205.1L293.1 269.1M285.7 260.7L293.1 269.1L282 270" />
    <path d="M345 120.1L503.1 184.1M495.7 175.7L503.1 184.1L492 185" />
    <path d="M345 269.9L503.1 205.9M492 205L503.1 205.9L495.7 214.3" />
  </g>
  <circle cx="110" cy="195" r="27" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="110" y="201" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">x</text>
  <circle cx="320" cy="110" r="27" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="320" y="116" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">h₁</text>
  <circle cx="320" cy="280" r="27" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="320" y="286" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">h₂</text>
  <circle cx="530" cy="195" r="27" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="530" y="201" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">p</text>
  <text x="200" y="135" text-anchor="end" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">w₁</tspan> = −2</text>
  <text x="200" y="270" text-anchor="end" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">w₂</tspan> = 2</text>
  <text x="440" y="135" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">v₁</tspan> = 4</text>
  <text x="440" y="270" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">v₂</tspan> = 4</text>
  <text x="320" y="72" text-anchor="middle" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b₁</tspan> = 6</text>
  <text x="320" y="332" text-anchor="middle" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">b₂</tspan> = −22</text>
  <text x="530" y="157" text-anchor="middle" fill="#8a847d" font-size="15"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">c</tspan> = −3</text>
</svg>
