<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <title>Łańcuch od w₁ do kary zamówienia na 3 km: zmiana w₁ zmienia z₁ 3 razy bardziej, h₁ zmienia się 0,25 raza tyle co z₁, z 4 razy tyle co h₁, a kara −0,731 raza tyle co z, więc nachylenie względem w₁ wynosi 3 × 0,25 × 4 × (−0,731) = −2,193</title>
  <rect x="32" y="88" width="60" height="44" rx="8" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="62" y="117" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">w₁</text>
  <rect x="162" y="88" width="60" height="44" rx="8" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="192" y="117" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">z₁</text>
  <rect x="292" y="88" width="60" height="44" rx="8" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="322" y="117" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">h₁</text>
  <rect x="422" y="88" width="60" height="44" rx="8" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="452" y="117" text-anchor="middle" fill="#2f6fdb" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20">z</text>
  <rect x="532" y="88" width="96" height="44" rx="8" fill="#2f6fdb" fill-opacity="0.1" stroke="#2f6fdb" stroke-width="2" />
  <text x="580" y="115" text-anchor="middle" fill="#2f6fdb" font-size="16">kara</text>
  <g fill="none" stroke="#8a847d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 110H156M148 104L156 110L148 116" />
    <path d="M228 110H286M278 104L286 110L278 116" />
    <path d="M358 110H416M408 104L416 110L408 116" />
    <path d="M488 110H526M518 104L526 110L518 116" />
  </g>
  <g fill="#8a847d">
    <text x="20" y="36" font-size="14">dla każdego zamówienia</text>
    <text x="20" y="190" font-size="14">dla zamówienia na 3 km</text>
  </g>
  <text x="127" y="70" text-anchor="middle" fill="#8a847d" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">× x</text>
  <text x="127" y="162" text-anchor="middle" fill="#8a847d" font-size="16">× 3</text>
  <text x="257" y="70" text-anchor="middle" fill="#8a847d" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">× h₁(1 − h₁)</text>
  <text x="257" y="162" text-anchor="middle" fill="#8a847d" font-size="16">× 0,25</text>
  <text x="387" y="70" text-anchor="middle" fill="#8a847d" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">× v₁</text>
  <text x="387" y="162" text-anchor="middle" fill="#8a847d" font-size="16">× 4</text>
  <text x="507" y="70" text-anchor="middle" fill="#8a847d" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">× (p − y)</text>
  <text x="507" y="162" text-anchor="middle" fill="#8a847d" font-size="16">× (−0,731)</text>
  <text x="320" y="240" text-anchor="middle" fill="#8a847d" font-size="16">nachylenie względem <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic">w₁</tspan> = 3 × 0,25 × 4 × (−0,731) = −2,193</text>
</svg>
