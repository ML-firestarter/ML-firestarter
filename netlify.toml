# Netlify builds and publishes the site on every push to the production branch.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Files in /_astro/ have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Each certificate's address, like /certificates/3f9a1c0e7b2d4a55/, shows the certificate page,
# which reads the certificate's id from the address. Files under /certificates/, like the
# badges, are served as they are.
[[redirects]]
  from = "/certificates/*"
  to = "/certificates/index.html"
  status = 200

[[redirects]]
  from = "/pl/certificates/*"
  to = "/pl/certificates/index.html"
  status = 200

# Missing pages under /pl/ get the Polish "page not found" page; the rest get 404.html.
# Existing pages are never affected, because Netlify serves files before applying this rule.
[[redirects]]
  from = "/pl/*"
  to = "/pl/404/index.html"
  status = 404
