# Netlify builds and publishes the site on every push to the production branch.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Files in /_astro/ have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Missing pages under /pl/ get the Polish "page not found" page; the rest get 404.html.
# Existing pages are never affected, because Netlify serves files before applying this rule.
[[redirects]]
  from = "/pl/*"
  to = "/pl/404/index.html"
  status = 404
